[project]
name = "syncbeat-sync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil Saji", email = "nikhilsaji200@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.59",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
]

[project.scripts]
syncbeat-sync = "syncbeat_sync:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
